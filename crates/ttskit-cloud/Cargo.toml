[package]
name = "ttskit-cloud"
description = "Steam Cloud backend abstraction for ttskit (unofficial Tabletop Simulator tooling)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Steam Remote Storage backend. Off by default so that builds without it never
# need the Steamworks SDK. An executable built with it needs steam_api64.dll
# next to it at runtime.
steam = ["dep:steamworks", "dep:steamworks-sys"]

[dependencies]
bson = "3.1"
thiserror = "2"
steamworks = { version = "0.13.1", optional = true }
steamworks-sys = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3"
