[package]
name = "ttskit"
description = "Unofficial command line toolkit for Tabletop Simulator mod development"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[features]
default = []
# Steam Cloud access. Off by default so that builds without it never need the
# Steamworks SDK. An executable built with it needs steam_api64.dll next to it
# at runtime (`cargo run` and `cargo test` find it without that).
steam = ["ttskit-cloud/steam"]
# Image tools (`ttskit image ...`). Off by default so that builds without it
# never pull in the image decoders.
image = ["dep:ttskit-image"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
jiff = "0.2"
notify = "8"
rmcp = { version = "3.11", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "signal", "sync"] }
ttskit-cloud = { path = "../ttskit-cloud" }
ttskit-core = { path = "../ttskit-core" }
ttskit-editor = { path = "../ttskit-editor" }
ttskit-image = { path = "../ttskit-image", optional = true }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }
ttskit-testutil = { path = "../ttskit-testutil" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
