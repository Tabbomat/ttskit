[package]
name = "ttskit-image"
description = "Image inspection and processing for ttskit (unofficial Tabletop Simulator tooling)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
oxipng = { version = "10.2.1", default-features = false, features = ["parallel", "zopfli"] }
exoquant = { version = "0.2.0", default-features = false }
png = "0.18"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
globset = "0.4"
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
